<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1317" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />


    <title>Rifting Wrapped | Your League of Legends Stats, Unwrapped</title>
    <meta name="description"
        content="Track your League of Legends stats: your top champions, your best (and worst) games, how many hours you play, and how each week stacks up." />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <meta name="robots" content="index, follow">

    <link rel="preconnect" href="https://ddragon.leagueoflegends.com" crossorigin />
    <link rel="preconnect" href="https://riftingwrapped.onrender.com" crossorigin />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- A plain stylesheet link, not the preload + onload="this.rel=..." trick:
         customHttp.yml's Content-Security-Policy (script-src 'self') blocks inline
         event handlers, so in production the onload is blocked and the fonts never
         apply. display=swap in the URL keeps text visible while they load. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Bricolage+Grotesque:wght@600;700;800;900&display=swap" crossorigin="anonymous">



    <!-- Critical for render-blocking req -->
    <style>
        /* ---------------------------------------------------------------
           Design tokens. Everything visual should come from here: pages and
           components consume these rather than hard-coding values, and the
           chart palette is read from here by src/resources/theme.js.
           --------------------------------------------------------------- */
        :root {
            color-scheme: dark;

            /* Surfaces, darkest to lightest */
            --bg-color: #0a0e14;
            --second-bg-color: #141a21;   /* card / tile surface */
            --surface-2: #1c232c;         /* raised: hover, nested tiles */
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.16);

            /* Brand accent. --accent-color is for fills (buttons, bars) where
               white text sits on top; --accent-text is the same hue lifted to
               ~5:1 so pink text stays readable on the dark background. */
            --accent-color: #c52184;
            --accent-hover: #d6308f;
            --accent-text: #e0428f;
            --accent-background-color: #c5218426;

            --text-color: #FFFFFF;
            --text-muted-color: #9DA3A6;

            /* Chart palette - validated for colour-blind separation and >= 3:1
               contrast on both background surfaces. Kills/deaths, damage types
               and roles each keep one colour everywhere they appear. */
            --chart-1: #3987e5;           /* blue */
            --chart-2: #d95926;           /* orange */
            --chart-3: #199e70;           /* aqua */
            --chart-4: #c98500;           /* yellow */
            --chart-5: #d55181;           /* magenta */
            --chart-violet: #9085e9;
            --chart-kills: var(--chart-2);
            --chart-deaths: var(--chart-1);
            --chart-muted: #4a515c;       /* non-highlighted bars */
            --chart-grid: rgba(255, 255, 255, 0.07);
            --chart-axis: #9DA3A6;

            /* Shape and spacing */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-pill: 999px;
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;
            --space-7: 48px;

            /* The site uses exactly two families: Bricolage Grotesque for
               headings and wordmarks, Lato for everything else. sans-serif is
               only a safety net if Google Fonts fails to load. */
            --font-body: "Lato", sans-serif;
            --font-display: "Bricolage Grotesque", "Lato", sans-serif;

            /* Type scale — fixed sizes for UI text (the same at every width,
               16px body like most sites), fluid clamp()s for the slide-deck's
               big "flex" numbers and hero display moments. The display sizes
               also follow screen height (dvh) so a short laptop window
               shrinks them instead of overflowing the slide. */
            --fs-2xs: 12px;
            --fs-xs: 14px;
            --fs-sm: 16px;
            --fs-md: 20px;
            --fs-lg: 24px;
            --fs-xl: 28px;
            --fs-2xl: 36px;
            --fs-display-sm: clamp(20px, min(5vw, 4dvh), 30px);
            --fs-display-md: clamp(28px, min(7vw, 6dvh), 44px);
            --fs-display-lg: clamp(40px, min(12vw, 9dvh), 64px);
        }

        /* Border-box reset. This lives here, with the tokens, because this block
           is the only stylesheet guaranteed to load before any route's CSS chunk.
           It used to be declared only in Home.css and Policy.css, which are
           lazy-loaded - so routes that never load those chunks (the player slide
           deck, AddingPlayer) fell back to content-box, and every
           "width: 100%" element with padding overflowed its container by exactly
           its padding. */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        /* Form controls don't inherit the page font by default, which left the
           search box, region picker and every button in the system font. */
        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit;
        }

        /* Every heading uses the display face (the Home hero's font) so pages
           don't mix Lato and Bricolage headings. */
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-display);
        }

        :focus-visible {
            outline: 2px solid var(--accent-text);
            outline-offset: 2px;
        }

        body {
            margin: 0;
            font-family: var(--font-body);
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            overscroll-behavior: none;
            font-display: swap;
        }

        #root {
            position: relative;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
            min-height: 100vh;
            overscroll-behavior-y: none;

        }

        @media (max-width: 768px) {
            #root {
                min-height: auto;
                height: auto;
            }
        }

        .dropdownItem {
            background-color: var(--second-bg-color);
            border-left: 3px solid transparent;
            transition: border-color 120ms ease, background-color 120ms ease;
        }

        .dropdownItem[aria-selected="true"] {
            background-color: var(--second-bg-color);
            border-left-color: var(--accent-color);
            filter: brightness(1.15);
        }
    </style>



</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3KJTMB7K3W"></script>
<script src="%PUBLIC_URL%/gtag-init.js"></script>


<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

</body>



</html>
