    <!-- A plain stylesheet link, not the preload + onload="this.rel=..." trick:
         customHttp.yml's Content-Security-Policy (script-src 'self') blocks inline
         event handlers, so in production the onload is blocked and the fonts never
         apply. display=swap in the URL keeps text visible while they load. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Bricolage+Grotesque:wght@600;700;800;900&display=swap" crossorigin="anonymous">



    <!-- Critical for render-blocking req -->
    <style>
        /* ---------------------------------------------------------------
           Design tokens. Everything visual should come from here: pages and
           components consume these rather than hard-coding values, and the
           chart palette is read from here by src/resources/theme.js.
           --------------------------------------------------------------- */
        :root {
            color-scheme: dark;

            /* Surfaces, darkest to lightest */
            --bg-color: #0a0e14;
            --second-bg-color: #141a21;   /* card / tile surface */
            --surface-2: #1c232c;         /* raised: hover, nested tiles */
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.16);

            /* Brand accent. --accent-color is for fills (buttons, bars) where
               white text sits on top; --accent-text is the same hue lifted to
               ~5:1 so pink text stays readable on the dark background. */
            --accent-color: #c52184;
            --accent-hover: #d6308f;
            --accent-text: #e0428f;
            --accent-background-color: #c5218426;

            --text-color: #FFFFFF;
            --text-muted-color: #9DA3A6;

            /* Status. Errors get their own red so they never read as a
               brand highlight; >= 5.7:1 on every surface. */
            --danger: #f87171;

            /* Chart palette - validated for colour-blind separation and >= 3:1
               contrast on both background surfaces. Kills/deaths, damage types
               and roles each keep one colour everywhere they appear. */
            --chart-1: #3987e5;           /* blue */
            --chart-2: #d95926;           /* orange */
            --chart-3: #199e70;           /* aqua */
            --chart-4: #c98500;           /* yellow */
            --chart-violet: #9085e9;
            --chart-kills: var(--chart-2);
            --chart-deaths: var(--chart-1);
            --chart-muted: #68707c;       /* non-highlighted bars; >= 3:1 on every surface */
            --chart-grid: rgba(255, 255, 255, 0.07);
            --chart-axis: #9DA3A6;

            /* Shape and spacing */
            --radius-xs: 4px;             /* bars, chips, tiny swatches */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 24px;            /* the share/summary card */
            --radius-pill: 999px;
            --radius-round: 50%;

            /* Elevation: one shadow for anything that floats over the page. */
            --shadow-raised: 0 12px 32px rgba(0, 0, 0, 0.35);

            /* Weights actually loaded from Google Fonts (Lato 400/700/900,
               Bricolage 600-900); anything else is synthesised or rounded. */
            --weight-regular: 400;
            --weight-semibold: 600;
            --weight-bold: 700;
            --weight-heavy: 800;
            --weight-black: 900;

            /* Motion */
            --duration-fast: 120ms;       /* hovers, presses */
            --duration-base: 200ms;       /* small state changes */
            --duration-slow: 350ms;       /* slides, large movement */
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);

            /* Stacking order, lowest to highest */
            --z-raised: 1;
            --z-overlay: 20;              /* deck progress bar */
            --z-controls: 30;             /* deck prev/next buttons */
            --z-header: 1000;
            /* rem so spacing grows with the reader's browser text size
               (identical to 4/8/12/16/24/32/48px at the default 16px). */
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-5: 1.5rem;
            --space-6: 2rem;
            --space-7: 3rem;

            /* The site uses exactly two families: Bricolage Grotesque for
               headings and wordmarks, Lato for everything else. sans-serif is
               only a safety net if Google Fonts fails to load. */
            --font-body: "Lato", sans-serif;
            --font-display: "Bricolage Grotesque", "Lato", sans-serif;

            /* Type scale — fixed sizes for UI text (the same at every width,
               1rem = 16px body like most sites), fluid clamp()s for the
               slide-deck's big "flex" numbers and hero display moments. The
               display sizes also follow screen height (dvh) so a short laptop
               window shrinks them instead of overflowing the slide. In rem so
               a larger browser text size is respected. */
            --fs-2xs: 0.75rem;
            --fs-xs: 0.875rem;
            --fs-sm: 1rem;
            --fs-md: 1.25rem;
            --fs-lg: 1.5rem;
            --fs-xl: 1.75rem;
            --fs-2xl: 2.25rem;
            --fs-display-sm: clamp(1.25rem, min(5vw, 4dvh), 1.875rem);
            --fs-display-md: clamp(1.75rem, min(7vw, 6dvh), 2.75rem);
            --fs-display-lg: clamp(2.5rem, min(12vw, 9dvh), 4rem);

            /* Tracking and leading go with size: big display type is pulled
               tighter, headings slightly, body stays at 0. */
            --tracking-display: -0.02em;
            --tracking-heading: -0.01em;
            --leading-display: 1.05;
            --leading-heading: 1.15;
        }

        /* Border-box reset. This lives here, with the tokens, because this block
           is the only stylesheet guaranteed to load before any route's CSS chunk.
           It used to be declared only in Home.css and Policy.css, which are
           lazy-loaded - so routes that never load those chunks (the player slide
           deck, AddingPlayer) fell back to content-box, and every
           "width: 100%" element with padding overflowed its container by exactly
           its padding. */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        /* Form controls don't inherit the page font by default, which left the
           search box, region picker and every button in the system font. */
        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit;
        }

        /* Every heading uses the display face (the Home hero's font) so pages
           don't mix Lato and Bricolage headings. */
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-display);
            letter-spacing: var(--tracking-heading);
            line-height: var(--leading-heading);
        }

        /* Reduced motion: no slides, bounces, pops or loops. Everything still
           lands in its final state; it just gets there without moving. */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-delay: 0ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                transition-delay: 0ms !important;
                scroll-behavior: auto !important;
            }
        }

        :focus-visible {
            outline: 2px solid var(--accent-text);
            outline-offset: 2px;
        }

        body {
            margin: 0;
            font-family: var(--font-body);
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            overscroll-behavior: none;
            font-display: swap;
        }

        #root {
            position: relative;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
            min-height: 100vh;
            overscroll-behavior-y: none;

        }

        @media (max-width: 768px) {
            #root {
                min-height: auto;
                height: auto;
            }
        }

        .dropdownItem {
            background-color: var(--second-bg-color);
            border-left: 3px solid transparent;
            transition: border-color 120ms ease, background-color 120ms ease;
        }

        .dropdownItem[aria-selected="true"] {
            background-color: var(--second-bg-color);
            border-left-color: var(--accent-color);
            filter: brightness(1.15);
        }
    </style>



</head>
