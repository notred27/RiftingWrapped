name: Match Scraper Cron

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: match-scraper
  cancel-in-progress: false

  
jobs:
  run-script:
    runs-on: ubuntu-latest
    # GitHub only starts the */10 schedule every few hours in practice, so each
    # run works through the queue for up to ~4 hours instead of 20 minutes.
    timeout-minutes: 245

    environment: Prod
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/actions/requirements.txt

      - name: Run scraper
        id: run-scraper
        env:
            REACT_APP_API_KEY: ${{ secrets.REACT_APP_API_KEY }}
            MONGO_URI: ${{ secrets.MONGO_URI }}
            WRAP_YEAR: ${{ vars.WRAP_YEAR }}
            MAX_RUN_SECONDS: '14100'
        run: python backend/actions/match_consumer.py

        
      - name: Show number of matches processed
        run: |
          echo "Step output num_matches=${{ steps.run-scraper.outputs.num_matches }}"
