name: Hourly Match Scraper

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Backfill: fetch every tracked player's matches from this many days back (blank = since the last successful run)"
        required: false
        default: ""

# A slow run must not overlap the next one: both would fetch the same matches.
concurrency:
  group: hourly-scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    environment: Prod
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/actions/requirements.txt

      - name: Run scraper
        id: run-scraper
        env:
            REACT_APP_API_KEY: ${{ secrets.REACT_APP_API_KEY }}
            MONGO_URI: ${{ secrets.MONGO_URI }}
            WRAP_YEAR: ${{ vars.WRAP_YEAR }}
            LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: |
          if [ -n "$LOOKBACK_DAYS" ]; then export LOOKBACK_SECONDS=$((LOOKBACK_DAYS * 86400)); fi
          python backend/actions/fetch-and-store.py

        
      - name: Show number of matches processed
        run: |
          echo "Step output num_matches=${{ steps.run-scraper.outputs.num_matches }}"