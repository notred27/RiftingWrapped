name: Precompute Spotlight Players

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

concurrency:
  group: precompute-spotlight
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest

    environment: Prod
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/actions/requirements.txt

      - name: Rebuild spotlight cache
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          WRAP_YEAR: ${{ vars.WRAP_YEAR }}
        run: python backend/actions/precompute_spotlight.py