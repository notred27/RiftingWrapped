name: Precompute Spotlight Players and Leaderboards

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

concurrency:
  group: precompute-spotlight
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest

    environment: Prod
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/actions/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/actions/requirements.txt

      - name: Rebuild spotlight cache
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          WRAP_YEAR: ${{ vars.WRAP_YEAR }}
          # The script rebuilds at most daily; a manual run always rebuilds.
          SPOTLIGHT_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python backend/actions/precompute_spotlight.py

      - name: Rebuild leaderboard cache
        if: ${{ !cancelled() }}     # independent of the spotlight step
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          WRAP_YEAR: ${{ vars.WRAP_YEAR }}
        run: python backend/actions/precompute_leaderboards.py
