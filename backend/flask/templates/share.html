<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta property="og:title" content="Rifting Wrapped - {{ username }}'s {{ year }} Stats" />
    <meta property="og:description" content="{{ username }} spent {{ hours_played }} hours on the Rift this year. Check out their top stats!" />
    {% if champ_name %}
    <meta property="og:image" content="https://ddragon.leagueoflegends.com/cdn/img/champion/splash/{{ champ_name }}_0.jpg" />
    {% else %}
    <meta property="og:image" content="https://www.riftingwrapped.com/android-chrome-512x512.png" />
    {% endif %}
    <meta property="og:site_name" content="Rifting Wrapped" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.riftingwrapped.com/player/{{ puuid }}?year={{ year }}" />

    <title>Rifting Wrapped - {{ username }}</title>

    <link rel="canonical" href="https://www.riftingwrapped.com/player/{{ puuid }}?year={{ year }}" />

</head>


<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3KJTMB7K3W"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  // Report a generic path so GA groups every share page together instead of
  // creating one row per player ID.
  gtag('config', 'G-3KJTMB7K3W', {
    page_location: 'https://riftingwrapped.onrender.com/share/:puuid',
    page_title: 'Share Redirect',
    content_group: 'Share Redirect'
  });
</script>


<body >
    <script>
        setTimeout(() => {
            window.location.href = `https://www.riftingwrapped.com/player/{{ puuid }}?year={{ year }}`;
        }, 1000);
    </script>

    

    <p>If you are not redirected, <a href="https://www.riftingwrapped.com/player/{{ puuid }}?year={{ year }}">click here</a>.</p>

    <noscript>
        <meta http-equiv="refresh" content="1; https://www.riftingwrapped.com/player/{{ puuid }}?year={{ year }}" />
    </noscript>

</body>
</html>
