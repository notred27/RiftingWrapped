<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ username }}'s Rifting Wrapped {{ year }}</title>
    <meta name="description" content="{{ username }} spent {{ hours_played }} hours on the Rift in {{ year }}. See their League of Legends year in review, then make your own." />

    <!-- Link previews (Discord, X/Twitter, iMessage, Slack...). Their crawlers
         read these tags and never run the redirect below. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rifting Wrapped" />
    <meta property="og:title" content="{{ username }}'s Rifting Wrapped {{ year }}" />
    <meta property="og:description" content="{{ username }} spent {{ hours_played }} hours on the Rift in {{ year }}. See their League of Legends year in review, then make your own." />
    <meta property="og:url" content="{{ share_url }}" />
    <meta property="og:image" content="{{ image_url }}" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{ username }}'s {{ year }} League of Legends stats" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="{{ image_url }}" />
    <meta name="theme-color" content="#c52184" />

    <link rel="canonical" href="{{ player_url }}" />
    <meta http-equiv="refresh" content="0; url={{ redirect_url }}" />
    <script>window.location.replace({{ redirect_url | tojson }});</script>
</head>
<body style="background:#0a0e14;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding-top:20vh">
    <p>Opening {{ username }}'s Wrapped&hellip; <a href="{{ redirect_url }}" style="color:#e0428f">continue</a></p>
</body>
</html>
